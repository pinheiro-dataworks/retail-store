[project]
name = "retail-forecast"
version = "2.0.0"
description = "Weekly sales forecasting pipeline that feeds the Retail Store dashboard."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Renan Pinheiro" }]
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD", "NPY"]
ignore = ["PD901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
